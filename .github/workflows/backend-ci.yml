name: Backend CI - Brain B & Security Verification

on:
  push:
    branches:
      - feat/mark-ii-backend-brain-b-release
      - feat/brain-b-production-recovery
    paths:
      - 'MARK II/Backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - feat/mark-ii-backend-brain-b-release
      - main
    paths:
      - 'MARK II/Backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Backend Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    defaults:
      run:
        working-directory: "MARK II/Backend"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "MARK II/Backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio requests-mock

      - name: Run verification test suites
        env:
          PYTHONPATH: "."
          VENNELA_BOSS_ID: "boss_ci_test"
          VENNELA_AGENT_TOKEN: "token_ci_test_secret_123456789"
          LIGHTWEIGHT_MODE: "true"
          VENNELA_MEMORY_PROVIDER: "stateless"
          VENNELA_MEMORY_ENABLED: "false"
          LLM_ROUTER_MOCK: "true"
        run: |
          pytest tests/test_mark_ii_memory_contracts.py tests/test_brain_b_production_activation.py tests/test_security_remediation.py -v
